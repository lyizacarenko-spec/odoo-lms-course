<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Адмінка курсу — Ikorka Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2b2d; --ink-soft:#4b5d5f; --bg:#f6f4ee; --panel:#ffffff;
    --line:#e3ded2; --teal:#1f4d47; --teal-dark:#173a35; --amber:#c98a3e;
    --danger:#b3462c; --ok:#3c7a5c; --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  header{
    background:var(--teal-dark); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  header .brand{font-weight:700; font-size:16px;}
  header .brand small{display:block; font-weight:400; font-size:12px; opacity:0.7;}
  header button{
    background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff;
    border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;
  }
  main{max-width:820px; margin:0 auto; padding:24px 18px 100px;}
  .login-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center;}
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:36px 32px; max-width:360px; width:100%; text-align:center;
  }
  .login-card h1{font-size:19px; margin:0 0 6px;}
  .login-card p{color:var(--ink-soft); font-size:13px; margin:0 0 20px;}
  input[type=text], input[type=password], input[type=number], textarea, select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; margin-bottom:10px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:100px;}
  label.field-label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
  button.btn{
    padding:10px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); font-size:13px; cursor:pointer; font-weight:600;
  }
  button.btn.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.btn.primary:hover{background:var(--teal-dark);}
  button.btn.danger{color:var(--danger); border-color:var(--danger);}
  button.btn.small{padding:6px 10px; font-size:12px;}
  .row{display:flex; gap:10px; align-items:center;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:12px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px;
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:16px;
  }
  h1.page-title{font-size:22px; margin:0 0 18px;}
  h2.section-title{font-size:15px; margin:24px 0 10px;}
  .add-form{border:1px dashed var(--line); border-radius:8px; padding:16px; margin-top:14px;}
  .thumb-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .thumb-row img{width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:pointer;}
  .upload-status{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--teal-dark); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:100;
  }
  .toast.show{opacity:1;}
  .loading{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:14px;}

  /* --- DEPARTMENT CARDS --- */
  .dept-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-top:16px;
  }
  .dept-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; cursor:pointer; transition:border-color .15s;
  }
  .dept-card:hover{border-color:var(--teal);}
  .dept-num{font-size:11px; letter-spacing:1px; color:var(--amber); font-weight:700; text-transform:uppercase;}
  .dept-card h2{font-size:17px; margin:6px 0 6px;}
  .dept-card p{font-size:13px; color:var(--ink-soft); margin:0; line-height:1.4;}
  .dept-add{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-style:dashed; color:var(--ink-soft); font-size:13px; text-align:center; gap:6px;
  }
  .plus{font-size:26px; color:var(--teal); font-weight:300;}

  /* --- FUNNEL --- */
  .funnel{
    display:flex; align-items:stretch; flex-wrap:wrap; gap:0; margin-top:16px;
  }
  .funnel-step{
    background:var(--panel); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; width:150px; cursor:pointer; transition:border-color .15s, transform .1s;
    display:flex; flex-direction:column; gap:8px;
  }
  .funnel-step:hover{border-color:var(--teal); transform:translateY(-2px);}
  .funnel-step-num{
    width:22px; height:22px; border-radius:50%; background:var(--teal); color:#fff;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .funnel-step-title{font-size:13px; font-weight:600; line-height:1.3;}
  .funnel-step-icons{display:flex; gap:6px; font-size:13px; opacity:0.35;}
  .funnel-step-icons span.on{opacity:1;}
  .funnel-arrow{
    display:flex; align-items:center; justify-content:center; color:var(--line);
    font-size:20px; width:28px; flex-shrink:0;
  }
  .funnel-step-add{
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    border-style:dashed; color:var(--ink-soft); font-size:12px; gap:4px;
  }
  @media (max-width:600px){
    .funnel{flex-direction:column;}
    .funnel-arrow{transform:rotate(90deg); width:auto; height:24px;}
    .funnel-step{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Адмінка курсу<small>Ikorka Shop LMS</small></div>
  <div id="headerActions"></div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://yctzcbaynycuibkqmwqd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pBkmNRVX61ELGcs1HqGV-Q_kBrVJWQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_PASSWORD = "ikorka2026"; // TODO: заміни на свій пароль

const app = document.getElementById('app');
const headerActions = document.getElementById('headerActions');

let state = {
  authed: sessionStorage.getItem('lms_admin') === 'yes',
  view: 'courses',       // courses | course | lesson
  courseId: null,
  lessonId: null,
  courses: [],
  lessons: [],
  tasks: []
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function logout(){
  sessionStorage.removeItem('lms_admin');
  state.authed = false;
  render();
}

async function render(){
  headerActions.innerHTML = state.authed ? `<button onclick="logout()">Вийти</button>` : '';
  if (!state.authed) return renderLogin();
  if (state.view === 'courses') return renderCourses();
  if (state.view === 'course') return renderCourse();
  if (state.view === 'lesson') return renderLesson();
}

function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Адмінка курсу</h1>
        <p>Введи пароль доступу</p>
        <input type="password" id="pw" placeholder="Пароль" />
        <button class="btn primary" style="width:100%" onclick="doLogin()">Увійти</button>
      </div>
    </div>`;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
}

function doLogin(){
  const v = document.getElementById('pw').value;
  if (v === ADMIN_PASSWORD){
    sessionStorage.setItem('lms_admin','yes');
    state.authed = true;
    render();
  } else {
    toast('Невірний пароль');
  }
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

// --- Санітизація імені файлу для Supabase Storage ---
// Storage key не приймає кирилицю, пробіли та деякі символи — транслітеруємо/чистимо.
function sanitizeFileName(name){
  const dot = name.lastIndexOf('.');
  const ext = dot >= 0 ? name.slice(dot) : '';
  let base = dot >= 0 ? name.slice(0, dot) : name;

  const map = {а:'a',б:'b',в:'v',г:'g',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',
    й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',
    ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'iu',я:'ia',ы:'y',э:'e',ъ:''};
  base = base.toLowerCase().split('').map(ch => map[ch] !== undefined ? map[ch] : ch).join('');
  base = base.replace(/[^a-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  if (!base) base = 'file';
  return base + ext.toLowerCase().replace(/[^a-z0-9.]/g, '');
}

function getYoutubeId(url){
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getDriveId(url){
  if (!url) return null;
  const m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function isDirectVideo(url){
  if (!url) return false;
  return /supabase\.co\/storage/.test(url) || /\.(mp4|webm|mov)$/i.test(url);
}

function renderVideoPreview(url){
  const yid = getYoutubeId(url);
  if (yid){
    return `<iframe width="100%" height="280" style="border-radius:8px;margin-bottom:8px;border:none;"
      src="https://www.youtube.com/embed/${yid}" allowfullscreen></iframe>`;
  }
  const did = getDriveId(url);
  if (did){
    return `<iframe width="100%" height="280" style="border-radius:8px;margin-bottom:8px;border:none;"
      src="https://drive.google.com/file/d/${did}/preview" allow="autoplay" allowfullscreen></iframe>`;
  }
  if (isDirectVideo(url)){
    return `<video controls style="width:100%;border-radius:8px;margin-bottom:8px;"><source src="${url}"></video>`;
  }
  return `<div class="upload-status">Посилання збережено: <a href="${url}" target="_blank">${url}</a></div>`;
}

async function saveVideoUrl(){
  const url = document.getElementById('videoUrlInput').value.trim();
  const { error } = await sb.from('lessons').update({ video_url: url }).eq('id', state.lessonId);
  if (error){ toast('Помилка збереження'); console.error(error); return; }
  toast('Посилання на відео збережено');
  renderLesson();
}

// ---------- COURSES (ВІДДІЛИ) ----------

async function loadCourses(){
  const { data, error } = await sb.from('courses').select('*').order('order_index');
  if (error){ toast('Помилка завантаження відділів'); console.error(error); return; }
  state.courses = data;
}

async function renderCourses(){
  app.innerHTML = '<div class="loading">Завантаження...</div>';
  await loadCourses();
  let html = `<h1 class="page-title">Відділи</h1>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:-10px;">Обери відділ, щоб побудувати його воронку навчання</p>`;
  html += `<div class="dept-grid">`;
  state.courses.forEach(c => {
    html += `
      <div class="dept-card" onclick="openCourse('${c.id}')">
        <div class="dept-num">Відділ</div>
        <h2>${c.title}</h2>
        <p>${c.description || ''}</p>
      </div>`;
  });
  html += `
      <div class="dept-card dept-add" onclick="showAddDept()">
        <div class="plus">+</div>
        <div>Новий відділ</div>
      </div>`;
  html += `</div>`;
  html += `
    <div class="add-form" id="addDeptForm" style="display:none;">
      <label class="field-label">Назва відділу</label>
      <input type="text" id="newCourseTitle" placeholder="Напр. Гарячі продажі" />
      <label class="field-label">Опис</label>
      <textarea id="newCourseDesc" placeholder="Короткий опис відділу"></textarea>
      <button class="btn primary" onclick="createCourse()">+ Створити відділ</button>
    </div>`;
  app.innerHTML = html;
}

function showAddDept(){
  document.getElementById('addDeptForm').style.display = 'block';
}

async function createCourse(){
  const title = document.getElementById('newCourseTitle').value.trim();
  if (!title) return toast('Введи назву відділу');
  const description = document.getElementById('newCourseDesc').value.trim();
  const order_index = state.courses.length + 1;
  const { error } = await sb.from('courses').insert({ title, description, order_index, is_active: true });
  if (error){ toast('Помилка створення'); console.error(error); return; }
  toast('Відділ додано');
  renderCourses();
}

async function openCourse(id){
  state.courseId = id;
  state.view = 'course';
  render();
}

async function loadLessons(courseId){
  const { data, error } = await sb.from('lessons').select('*').eq('course_id', courseId).order('order_index');
  if (error){ toast('Помилка завантаження кроків'); console.error(error); return; }
  state.lessons = data;
}

async function renderCourse(){
  app.innerHTML = '<div class="loading">Завантаження...</div>';
  await loadLessons(state.courseId);
  const course = state.courses.find(c => c.id === state.courseId);

  let html = `<button class="back-link" onclick="backToCourses()">← Усі відділи</button>
    <h1 class="page-title">${course.title}</h1>
    <div class="card">
      <label class="field-label">Назва відділу</label>
      <input type="text" id="courseTitle" value="${escAttr(course.title)}" />
      <label class="field-label">Опис</label>
      <textarea id="courseDesc">${course.description || ''}</textarea>
      <div class="row">
        <button class="btn primary small" onclick="saveCourse()">Зберегти зміни</button>
        <button class="btn danger small" onclick="deleteCourse()">Видалити відділ</button>
      </div>
    </div>

    <h2 class="section-title">Воронка навчання</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">Клікни на крок, щоб додати фото, відео, текст і завдання</p>

    <div class="funnel">`;

  state.lessons.forEach((l, idx) => {
    const hasVideo = !!l.video_url;
    const hasImages = l.images && l.images.length;
    const hasText = l.transcript_text && l.transcript_text.trim().length > 0;
    html += `
      <div class="funnel-step" onclick="openLesson('${l.id}')">
        <div class="funnel-step-num">${idx+1}</div>
        <div class="funnel-step-title">${l.title}</div>
        <div class="funnel-step-icons">
          <span class="${hasText ? 'on' : ''}" title="Текст">📝</span>
          <span class="${hasVideo ? 'on' : ''}" title="Відео">🎥</span>
          <span class="${hasImages ? 'on' : ''}" title="Фото">🖼️</span>
        </div>
      </div>
      ${idx < state.lessons.length - 1 ? '<div class="funnel-arrow">→</div>' : ''}`;
  });

  html += `
      ${state.lessons.length ? '<div class="funnel-arrow">→</div>' : ''}
      <div class="funnel-step funnel-step-add" onclick="showAddStep()">
        <div class="plus">+</div>
        <div>Новий крок</div>
      </div>
    </div>

    <div class="add-form" id="addStepForm" style="display:none;">
      <label class="field-label">Назва кроку воронки</label>
      <input type="text" id="newLessonTitle" placeholder="Напр. Дзвінок клієнту" />
      <button class="btn primary" onclick="createLesson()">+ Додати крок</button>
    </div>`;
  app.innerHTML = html;
}

function showAddStep(){
  document.getElementById('addStepForm').style.display = 'block';
}

async function saveCourse(){
  const title = document.getElementById('courseTitle').value.trim();
  const description = document.getElementById('courseDesc').value.trim();
  const { error } = await sb.from('courses').update({ title, description }).eq('id', state.courseId);
  if (error){ toast('Помилка збереження'); console.error(error); return; }
  toast('Збережено');
  const idx = state.courses.findIndex(c => c.id === state.courseId);
  state.courses[idx].title = title;
  state.courses[idx].description = description;
}

async function deleteCourse(){
  if (!confirm('Видалити відділ і всі його кроки та завдання? Це незворотньо.')) return;
  const { error } = await sb.from('courses').delete().eq('id', state.courseId);
  if (error){ toast('Помилка видалення'); console.error(error); return; }
  toast('Відділ видалено');
  backToCourses();
}

async function createLesson(){
  const title = document.getElementById('newLessonTitle').value.trim();
  if (!title) return toast('Введи назву кроку');
  const order_index = state.lessons.length + 1;
  const { error } = await sb.from('lessons').insert({
    course_id: state.courseId, title, order_index, images: []
  });
  if (error){ toast('Помилка створення кроку'); console.error(error); return; }
  toast('Крок додано');
  renderCourse();
}

function backToCourses(){
  state.view = 'courses';
  state.courseId = null;
  render();
}

// ---------- LESSON (КРОК) ----------

async function loadTasks(lessonId){
  const { data, error } = await sb.from('lesson_tasks').select('*').eq('lesson_id', lessonId).order('order_index');
  if (error){ toast('Помилка завантаження завдань'); console.error(error); return; }
  state.tasks = data;
}

async function openLesson(id){
  state.lessonId = id;
  state.view = 'lesson';
  render();
}

async function renderLesson(){
  app.innerHTML = '<div class="loading">Завантаження...</div>';
  await loadLessons(state.courseId);
  await loadTasks(state.lessonId);
  const lesson = state.lessons.find(l => l.id === state.lessonId);

  const images = lesson.images || [];
  let thumbs = images.map((url, i) => `<img src="${url}" onclick="removeImage(${i})" title="Клік — видалити" />`).join('');

  let html = `<button class="back-link" onclick="backToCourse()">← До воронки</button>
    <h1 class="page-title">${lesson.title}</h1>

    <div class="card">
      <label class="field-label">Назва кроку</label>
      <input type="text" id="lessonTitle" value="${escAttr(lesson.title)}" />

      <label class="field-label">Короткий опис / вступ</label>
      <textarea id="lessonDesc">${lesson.description || ''}</textarea>

      <label class="field-label">Текст кроку / транскрипт</label>
      <textarea id="lessonText" style="min-height:220px;">${lesson.transcript_text || ''}</textarea>

      <label class="field-label">Відео</label>
      ${lesson.video_url ? renderVideoPreview(lesson.video_url) : ''}

      <label class="field-label" style="margin-top:10px;">Варіант 1 — вставити посилання (Google Drive, YouTube тощо)</label>
      <div class="row">
        <input type="text" id="videoUrlInput" placeholder="https://drive.google.com/..." value="${isDirectVideo(lesson.video_url) ? '' : escAttr(lesson.video_url||'')}" />
        <button class="btn small" onclick="saveVideoUrl()">Зберегти</button>
      </div>

      <label class="field-label" style="margin-top:10px;">Варіант 2 — завантажити файл (до 50 МБ)</label>
      <input type="file" id="videoFile" accept="video/*" />
      <div class="upload-status" id="videoStatus"></div>

      <label class="field-label" style="margin-top:12px;">Фото / картинки</label>
      <div class="thumb-row">${thumbs}</div>
      <input type="file" id="imageFile" accept="image/*" multiple />
      <div class="upload-status" id="imageStatus"></div>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary small" onclick="saveLesson()">Зберегти крок</button>
        <button class="btn danger small" onclick="deleteLesson()">Видалити крок</button>
      </div>
    </div>

    <h2 class="section-title">Завдання (${state.tasks.length})</h2>`;

  state.tasks.forEach(t => {
    html += `
      <div class="card">
        <select id="taskType_${t.id}">
          <option value="self_check" ${t.task_type==='self_check'?'selected':''}>Питання на роздум</option>
          <option value="practical" ${t.task_type==='practical'?'selected':''}>Практика в Odoo</option>
          <option value="homework" ${t.task_type==='homework'?'selected':''}>Домашнє завдання</option>
        </select>
        <textarea id="taskText_${t.id}">${t.task_text}</textarea>
        <div class="row">
          <button class="btn small" onclick="saveTask('${t.id}')">Зберегти</button>
          <button class="btn danger small" onclick="deleteTask('${t.id}')">Видалити</button>
        </div>
      </div>`;
  });

  html += `
    <div class="add-form">
      <label class="field-label">Тип завдання</label>
      <select id="newTaskType">
        <option value="self_check">Питання на роздум</option>
        <option value="practical">Практика в Odoo</option>
        <option value="homework">Домашнє завдання</option>
      </select>
      <label class="field-label">Текст завдання</label>
      <textarea id="newTaskText" placeholder="Наприклад: Оформи замовлення на будь-який сет..."></textarea>
      <button class="btn primary" onclick="createTask()">+ Додати завдання</button>
    </div>`;

  app.innerHTML = html;
}

function backToCourse(){
  state.view = 'course';
  state.lessonId = null;
  render();
}

async function saveLesson(){
  const title = document.getElementById('lessonTitle').value.trim();
  const description = document.getElementById('lessonDesc').value.trim();
  const transcript_text = document.getElementById('lessonText').value;
  const { error } = await sb.from('lessons').update({ title, description, transcript_text }).eq('id', state.lessonId);
  if (error){ toast('Помилка збереження'); console.error(error); return; }
  toast('Крок збережено');
}

async function deleteLesson(){
  if (!confirm('Видалити крок і всі його завдання?')) return;
  const { error } = await sb.from('lessons').delete().eq('id', state.lessonId);
  if (error){ toast('Помилка видалення'); console.error(error); return; }
  toast('Крок видалено');
  backToCourse();
}

// --- File uploads ---

document.addEventListener('change', async (e) => {
  if (e.target.id === 'videoFile'){
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('videoStatus');
    if (file.size > 50 * 1024 * 1024){
      statusEl.textContent = 'Файл більший за 50 МБ — використай посилання (Варіант 1) замість завантаження.';
      return;
    }
    statusEl.textContent = 'Завантаження відео...';
    const safeName = sanitizeFileName(file.name);
    const path = `${state.lessonId}/${Date.now()}_${safeName}`;
    const { error } = await sb.storage.from('lesson-videos').upload(path, file, { upsert: true });
    if (error){ statusEl.textContent = 'Помилка: ' + error.message; console.error(error); return; }
    const { data: pub } = sb.storage.from('lesson-videos').getPublicUrl(path);
    await sb.from('lessons').update({ video_url: pub.publicUrl }).eq('id', state.lessonId);
    statusEl.textContent = 'Відео завантажено ✓';
    toast('Відео додано');
    renderLesson();
  }

  if (e.target.id === 'imageFile'){
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const statusEl = document.getElementById('imageStatus');
    statusEl.textContent = `Завантаження ${files.length} фото...`;
    const lesson = state.lessons.find(l => l.id === state.lessonId);
    let images = lesson.images || [];
    for (const file of files){
      const safeName = sanitizeFileName(file.name);
      const path = `${state.lessonId}/${Date.now()}_${safeName}`;
      const { error } = await sb.storage.from('lesson-images').upload(path, file, { upsert: true });
      if (error){ statusEl.textContent = 'Помилка: ' + error.message; console.error(error); continue; }
      const { data: pub } = sb.storage.from('lesson-images').getPublicUrl(path);
      images.push(pub.publicUrl);
    }
    await sb.from('lessons').update({ images }).eq('id', state.lessonId);
    statusEl.textContent = 'Фото завантажено ✓';
    toast('Фото додано');
    renderLesson();
  }
});

async function removeImage(idx){
  if (!confirm('Прибрати це фото з уроку?')) return;
  const lesson = state.lessons.find(l => l.id === state.lessonId);
  const images = (lesson.images || []).filter((_, i) => i !== idx);
  await sb.from('lessons').update({ images }).eq('id', state.lessonId);
  toast('Фото прибрано');
  renderLesson();
}

// --- Tasks ---

async function createTask(){
  const task_type = document.getElementById('newTaskType').value;
  const task_text = document.getElementById('newTaskText').value.trim();
  if (!task_text) return toast('Введи текст завдання');
  const order_index = state.tasks.length + 1;
  const { error } = await sb.from('lesson_tasks').insert({ lesson_id: state.lessonId, task_type, task_text, order_index });
  if (error){ toast('Помилка створення'); console.error(error); return; }
  toast('Завдання додано');
  renderLesson();
}

async function saveTask(id){
  const task_type = document.getElementById('taskType_'+id).value;
  const task_text = document.getElementById('taskText_'+id).value;
  const { error } = await sb.from('lesson_tasks').update({ task_type, task_text }).eq('id', id);
  if (error){ toast('Помилка збереження'); console.error(error); return; }
  toast('Завдання збережено');
}

async function deleteTask(id){
  if (!confirm('Видалити завдання?')) return;
  const { error } = await sb.from('lesson_tasks').delete().eq('id', id);
  if (error){ toast('Помилка видалення'); console.error(error); return; }
  toast('Завдання видалено');
  renderLesson();
}

// Захист: якщо файл перетягнути мишкою будь-куди на сторінку (не на кнопку вибору),
// браузер за замовчуванням спробує відкрити файл напряму і "зламає" сторінку. Блокуємо це.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  if (e.target.tagName !== 'INPUT'){
    e.preventDefault();
    toast('Перетягування файлів не підтримується — натисни кнопку "Вибрати файл"');
  }
});

render();
</script>
